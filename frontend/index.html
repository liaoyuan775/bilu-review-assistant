<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="公安智能笔录审查助手演示原型" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23145fbe'/%3E%3Cpath d='M19 17h20l6 6v24H19z' fill='white'/%3E%3Cpath d='M39 17v8h8M25 32h14M25 39h11' fill='none' stroke='%23145fbe' stroke-width='3'/%3E%3C/svg%3E" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preload" href="/fonts/noto-sans-sc-400.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/noto-sans-sc-600.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/noto-sans-sc-700.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <title>公安智能笔录审查助手</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.childElementCount) return;
        root.textContent = "页面加载失败：" + String((event.error && event.error.message) || event.message || "未知错误");
        root.style.cssText = "padding:24px;font:14px/1.5 sans-serif;color:#b42318;white-space:pre-wrap";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
